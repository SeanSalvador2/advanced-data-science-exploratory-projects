[project]
name = "spike"
version = "0.1.0"
description = "Local-only lecture recording, transcription and accuracy-spike harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "pypdf>=4.2",
    "jiwer>=3.0",
    "wordfreq>=3.1",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4; platform_system == 'Darwin' and platform_machine == 'arm64'"]
parakeet = ["parakeet-mlx>=0.3; platform_system == 'Darwin' and platform_machine == 'arm64'"]

[project.scripts]
spike = "spike.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: integration tests that download a model (deselect with '-m \"not slow\"')"]
